# Every server a test starts listens on 127.0.0.1. Tomcat binds every address while
# server.address is unset, and macOS gives such a bind a port that another program
# holds on 127.0.0.1 alone, where a call to 127.0.0.1 reaches the other program. An
# IDE holds about fourteen such ports, and a test read its web page that way.
#
# SpringApplication reads this file in each @SpringBootTest context, in each
# application a test builds itself and in the hosts that run in a JVM of their own,
# whose classpath carries these resources. The context runners of the slice tests
# leave the file unread, so a test of an unset server.address sees it unset.
# TestServerAddressTests holds the address in place.
server.address=127.0.0.1
